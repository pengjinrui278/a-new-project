<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文章工作台</title><style>body{margin:auto;max-width:820px;padding:24px;font:16px system-ui;background:#f7f9fc;color:#203047}form,article{background:white;border:1px solid #dce5f1;border-radius:12px;padding:18px;margin:16px 0}input,textarea,button{font:inherit;padding:8px;margin:4px;max-width:95%}textarea{display:block;width:95%}blockquote{white-space:pre-wrap;margin:12px 0;padding:12px;background:#f0f6fd;overflow-wrap:anywhere}button{cursor:pointer}math{font-size:1.15em}</style><h1 id="label">文章工作台</h1><p id="status" role="status"></p><form id="auth"><input name="name" placeholder="账号" required><input name="password" placeholder="密码（至少八位）" type="password" required><input name="label" placeholder="自定义博客名称（注册时可填）"><button value="login">登录</button><button value="register">注册</button></form><main id="library" hidden><form id="settings"><input name="label" aria-label="博客名称"><button>保存名称</button><button type="button" id="logout">退出</button></form><h2>文章 · 私人笔记</h2><div id="notes"></div></main><script src="/app.js" defer></script></html>
